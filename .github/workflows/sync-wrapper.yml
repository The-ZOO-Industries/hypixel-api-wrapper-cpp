name: Sync wrapper from HypixelTracking

on:
  schedule:
    # GitHub cron is UTC and not guaranteed to fire exactly on time; expect drift.
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-wrapper
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Regenerate wrapper
        run: python scripts/sync_wrapper.py

      - name: Commit if changed
        run: |
          if [[ -z "$(git status --porcelain include/hypixel.hpp)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add include/hypixel.hpp
          git commit -m "Sync wrapper from HypixelTracking"
          git push
